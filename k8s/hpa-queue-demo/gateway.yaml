apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-gateway
  namespace: k8s-hpa-queue-demo
  labels:
    app: inference-gateway
    app.kubernetes.io/version: "0.2.4"
spec:
  # HPA owns the replica count; this is only the starting point.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: inference-gateway
  template:
    metadata:
      labels:
        app: inference-gateway
        app.kubernetes.io/version: "0.2.4"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ai-inference-gateway:v0.2.4
          imagePullPolicy: IfNotPresent
          env:
            - name: VLLM_BASE_URL
              value: http://mock-vllm:8000
            - name: MODEL_NAME
              value: mock-qwen
            # Deliberately small concurrency and a deep queue so the waiting
            # gauge actually moves under load.
            - name: GATEWAY_MAX_CONCURRENT
              value: "2"
            - name: GATEWAY_MAX_QUEUE
              value: "128"
            - name: GATEWAY_QUEUE_TIMEOUT_SECONDS
              value: "30"
            - name: GATEWAY_VERSION
              value: "0.2.4"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: k8s-hpa-queue-demo
  labels:
    app: inference-gateway
spec:
  type: ClusterIP
  selector:
    app: inference-gateway
  ports:
    - name: http
      port: 9000
      targetPort: http
      protocol: TCP
