<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local Inference Lab</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f7f5;
        --surface: #ffffff;
        --sidebar: #fbfbfa;
        --border: #e7e6e1;
        --border-strong: #d9d8d2;
        --text: #1f1f1d;
        --muted: #77766f;
        --faint: #a3a29b;
        --accent: #1f6f4a;
        --accent-soft: #e9f2ec;
        --user: #efefec;
        --shadow: 0 1px 2px rgb(17 17 15 / 4%), 0 12px 32px rgb(17 17 15 / 5%);
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-size: 15px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      button, textarea, select { font: inherit; }
      button { cursor: pointer; }
      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: 236px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        padding: 18px 14px;
        background: var(--sidebar);
        border-right: 1px solid var(--border);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 4px 6px 10px;
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: #1d1d1b;
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: -.02em;
      }
      .brand-name { font-size: 13px; font-weight: 650; letter-spacing: -.01em; }
      .brand-sub { color: var(--faint); font-size: 11px; margin-top: 1px; }
      .new-chat {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        width: 100%;
        padding: 9px 12px;
        border: 1px solid #1d1d1b;
        border-radius: 9px;
        background: #1d1d1b;
        color: #fff;
        font-size: 13px;
        font-weight: 600;
      }
      .new-chat:hover { background: #333330; }
      .nav { display: flex; flex-direction: column; gap: 2px; }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 8px 9px;
        border-radius: 8px;
        color: var(--muted);
        font-size: 13px;
        text-decoration: none;
      }
      .nav-item:hover { background: #f1f1ee; color: var(--text); }
      .nav-item.active { background: #efefec; color: var(--text); font-weight: 550; }
      .nav-icon { width: 15px; height: 15px; opacity: .78; flex: none; }
      .sidebar-spacer { flex: 1; }
      .model-chip {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 10px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: #fff;
        color: var(--muted);
        font-size: 11px;
      }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
      .main {
        margin-left: 236px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 62px;
        padding: 0 28px;
        border-bottom: 1px solid var(--border);
        background: rgb(255 255 255 / 82%);
        backdrop-filter: blur(14px);
      }
      .crumbs { display: flex; align-items: center; gap: 7px; color: var(--faint); font-size: 12px; }
      .crumbs strong { color: var(--text); font-weight: 600; }
      .top-actions { display: flex; align-items: center; gap: 9px; }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 6px 10px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: #fff;
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
      }
      .status::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #b8b7b0;
      }
      .status.ok { color: var(--accent); border-color: #cfe3d7; background: #f7fbf8; }
      .status.ok::before { background: var(--accent); }
      .language {
        padding: 6px 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #fff;
        color: var(--muted);
        font-size: 12px;
      }
      .content {
        width: min(820px, calc(100% - 48px));
        margin: 0 auto;
        flex: 1;
        padding: 38px 0 190px;
      }
      .intro { margin-bottom: 30px; }
      .intro h1 { margin: 0 0 5px; font-size: 22px; line-height: 1.25; letter-spacing: -.02em; }
      .intro p { margin: 0; color: var(--muted); font-size: 13px; }
      .chat { display: flex; flex-direction: column; gap: 24px; }
      .message { display: flex; flex-direction: column; gap: 6px; }
      .message.user { align-items: flex-end; }
      .role {
        color: var(--faint);
        font-size: 10px;
        font-weight: 650;
        letter-spacing: .08em;
        text-transform: uppercase;
      }
      .bubble {
        max-width: 100%;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .message.user .bubble {
        max-width: 76%;
        padding: 11px 14px;
        border-radius: 14px 14px 3px 14px;
        background: var(--user);
      }
      .message.assistant .bubble {
        padding: 0 0 0 14px;
        border-left: 2px solid #d8e8dd;
        line-height: 1.72;
      }
      .meta { color: var(--faint); font-size: 11px; }
      .composer-wrap {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 236px;
        z-index: 6;
        padding: 24px 24px 26px;
        background: linear-gradient(180deg, rgb(247 247 245 / 0%), var(--bg) 24%);
      }
      .composer {
        width: min(820px, 100%);
        margin: 0 auto;
        padding: 12px 12px 10px;
        border: 1px solid var(--border-strong);
        border-radius: 16px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }
      .composer textarea {
        display: block;
        width: 100%;
        min-height: 52px;
        max-height: 180px;
        resize: none;
        padding: 2px 3px 8px;
        border: 0;
        outline: none;
        background: transparent;
        color: var(--text);
        font-size: 15px;
        line-height: 1.55;
      }
      .composer textarea::placeholder { color: var(--faint); }
      .composer-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 11px; color: var(--muted); font-size: 11px; }
      .toolbar label { display: flex; align-items: center; gap: 5px; }
      .toolbar input[type="number"] {
        width: 56px;
        padding: 4px 5px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #fbfbfa;
        color: var(--text);
        font-size: 11px;
      }
      .toolbar input[type="checkbox"] { accent-color: var(--accent); }
      .clear {
        border: 0;
        background: transparent;
        color: var(--faint);
        font-size: 11px;
        padding: 4px 2px;
      }
      .clear:hover { color: var(--text); }
      .send {
        min-width: 74px;
        padding: 8px 14px;
        border: 1px solid #1d1d1b;
        border-radius: 9px;
        background: #1d1d1b;
        color: #fff;
        font-size: 12px;
        font-weight: 600;
      }
      .send:hover { background: #333330; }
      .send:disabled { cursor: wait; opacity: .55; }
      @media (max-width: 820px) {
        .sidebar { display: none; }
        .main { margin-left: 0; }
        .composer-wrap { left: 0; padding: 16px 12px 18px; }
        .topbar { padding: 0 16px; min-height: 56px; }
        .content { width: calc(100% - 28px); padding-top: 26px; padding-bottom: 180px; }
        .message.user .bubble { max-width: 88%; }
        .crumbs { display: none; }
      }
    </style>
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">L</div>
        <div>
          <div class="brand-name">Local Inference Lab</div>
          <div class="brand-sub">8 GB delivery workspace</div>
        </div>
      </div>
      <button id="newChat" class="new-chat" type="button">+ <span data-i18n="newChat">New chat</span></button>
      <nav class="nav" aria-label="Workspace">
        <a class="nav-item active" href="#">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 12a8 8 0 0 1-8 8H6l-3 2 1-5a8 8 0 1 1 17-5Z"/></svg>
          <span data-i18n="navChat">Chat</span>
        </a>
        <a class="nav-item" href="https://github.com/francisown/8gb-llm-inference-delivery#readme" target="_blank" rel="noreferrer">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 19V5m0 14h16M8 15l3-4 3 2 4-6"/></svg>
          <span data-i18n="navBenchmarks">Benchmarks</span>
        </a>
        <a class="nav-item" href="https://github.com/francisown/8gb-llm-inference-delivery/tree/main/docs" target="_blank" rel="noreferrer">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 3h9l3 3v15H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
          <span data-i18n="navDocs">Docs</span>
        </a>
      </nav>
      <div class="sidebar-spacer"></div>
      <div class="model-chip"><span class="dot"></span><span>Qwen3.5-4B · RTX 5060 8 GB</span></div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="crumbs"><span>Workspace</span><span>/</span><strong data-i18n="navChat">Chat</strong></div>
        <div class="top-actions">
          <span id="status" class="status" data-i18n="checking">Checking service…</span>
          <select id="language" class="language" aria-label="Language">
            <option value="en">English</option>
            <option value="zh">中文</option>
          </select>
        </div>
      </header>

      <main class="content">
        <div class="intro">
          <h1 data-i18n="title">Local Inference Lab</h1>
          <p data-i18n="subtitle">A quantized 4B model on one 8 GB GPU, served through a FastAPI gateway.</p>
        </div>

        <section id="chat" class="chat" aria-live="polite"></section>
      </main>

      <div class="composer-wrap">
        <form id="form" class="composer">
          <textarea id="message" data-i18n-placeholder="placeholder" placeholder="Ask a question; Enter sends, Shift+Enter adds a line" required></textarea>
          <div class="composer-row">
            <div class="toolbar">
              <label><span data-i18n="maxTokens">Output tokens</span><input id="maxTokens" type="number" min="1" max="2048" value="128" /></label>
              <label><span data-i18n="temperature">Temperature</span><input id="temperature" type="number" min="0" max="2" step="0.1" value="0.6" /></label>
              <label><input id="thinking" type="checkbox" /><span data-i18n="thinking">Thinking</span></label>
              <label><input id="streaming" type="checkbox" checked /><span data-i18n="streaming">Streaming</span></label>
              <button id="clear" class="clear" type="button" data-i18n="clear">Clear</button>
            </div>
            <button id="send" class="send" type="submit" data-i18n="send">Send</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      const I18N = {
        en: {
          title: "Local Inference Lab",
          subtitle: "A quantized 4B model on one 8 GB GPU, served through a FastAPI gateway.",
          checking: "Checking service…",
          online: "Model online",
          offline: "Model unavailable",
          newChat: "New chat",
          navChat: "Chat",
          navBenchmarks: "Benchmarks",
          navDocs: "Docs",
          maxTokens: "Output tokens",
          temperature: "Temperature",
          thinking: "Thinking",
          streaming: "Streaming",
          clear: "Clear",
          placeholder: "Ask a question; Enter sends, Shift+Enter adds a line",
          send: "Send",
          you: "You",
          assistant: "Assistant",
          generating: "Generating…",
          waitingStream: "Waiting for the first token…",
          waitingFull: "Waiting for the full answer…",
          welcome: "Hello — this is the local model running on your RTX 5060. The page keeps the last two turns of context.",
          cleared: "Chat history cleared. Ask a new question.",
          streamClosed: "The stream ended before a done event.",
          failed: "Request failed: {message}",
          metaStream: "{tokens} tokens · TTFT {ttft} ms · total {latency} ms · {id}",
          metaFull: "{tokens} tokens · {latency} ms · {id}"
        },
        zh: {
          title: "本地推理实验室",
          subtitle: "在单张 8GB GPU 上运行量化 4B 模型，经由 FastAPI 网关提供服务。",
          checking: "检查服务中…",
          online: "模型在线",
          offline: "模型不可用",
          newChat: "新对话",
          navChat: "对话",
          navBenchmarks: "基准测试",
          navDocs: "文档",
          maxTokens: "输出 token",
          temperature: "温度",
          thinking: "思考",
          streaming: "流式",
          clear: "清空",
          placeholder: "输入问题；Enter 发送，Shift+Enter 换行",
          send: "发送",
          you: "你",
          assistant: "助手",
          generating: "生成中…",
          waitingStream: "正在等待第一个 token…",
          waitingFull: "正在等待模型返回完整答案…",
          welcome: "你好，这是运行在你 RTX 5060 上的本地模型。当前页面保存最近两轮对话历史。",
          cleared: "对话历史已清空。可以开始新的问题。",
          streamClosed: "流在完成事件之前断开。",
          failed: "请求失败：{message}",
          metaStream: "{tokens} tokens · TTFT {ttft} ms · 总计 {latency} ms · {id}",
          metaFull: "{tokens} tokens · {latency} ms · {id}"
        }
      };

      const chat = document.querySelector("#chat");
      const form = document.querySelector("#form");
      const input = document.querySelector("#message");
      const send = document.querySelector("#send");
      const status = document.querySelector("#status");
      const language = document.querySelector("#language");
      let history = [];
      const pageParams = new URLSearchParams(location.search);
      const forcedLanguage = pageParams.get("lang");
      let currentLanguage = forcedLanguage || localStorage.getItem("gateway-language") || (navigator.language.startsWith("zh") ? "zh" : "en");
      if (!I18N[currentLanguage]) currentLanguage = "en";

      function t(key, values = {}) {
        let text = I18N[currentLanguage][key] ?? I18N.en[key] ?? key;
        for (const [name, value] of Object.entries(values)) {
          text = text.replace(`{${name}}`, String(value));
        }
        return text;
      }

      function applyLanguage() {
        document.documentElement.lang = currentLanguage === "zh" ? "zh-CN" : "en";
        document.title = t("title");
        language.value = currentLanguage;
        for (const node of document.querySelectorAll("[data-i18n]")) {
          node.textContent = t(node.dataset.i18n);
        }
        for (const node of document.querySelectorAll("[data-i18n-placeholder]")) {
          node.placeholder = t(node.dataset.i18nPlaceholder);
        }
        if (!send.disabled) send.textContent = t("send");
        localStorage.setItem("gateway-language", currentLanguage);
      }

      function addMessage(role, content, meta = "") {
        const article = document.createElement("article");
        article.className = `message ${role}`;
        const label = document.createElement("div");
        label.className = "role";
        label.textContent = role === "user" ? t("you") : t("assistant");
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = content;
        article.append(label, bubble);
        if (meta) {
          const details = document.createElement("div");
          details.className = "meta";
          details.textContent = meta;
          bubble.append(details);
        }
        chat.append(article);
        chat.scrollTop = chat.scrollHeight;
        return article;
      }

      async function checkHealth() {
        try {
          const response = await fetch("/health");
          if (!response.ok) throw new Error();
          status.textContent = t("online");
          status.classList.add("ok");
        } catch {
          status.textContent = t("offline");
          status.classList.remove("ok");
        }
      }

      async function consumeSSE(response, onEvent) {
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        while (true) {
          const { value, done } = await reader.read();
          buffer += decoder.decode(value ?? new Uint8Array(), { stream: !done });
          let boundary;
          while ((boundary = buffer.indexOf("\n\n")) !== -1) {
            const block = buffer.slice(0, boundary);
            buffer = buffer.slice(boundary + 2);
            let eventName = "message";
            const dataLines = [];
            for (const line of block.split("\n")) {
              if (line.startsWith("event:")) eventName = line.slice(6).trim();
              if (line.startsWith("data:")) dataLines.push(line.slice(5).trim());
            }
            if (dataLines.length) onEvent(eventName, JSON.parse(dataLines.join("\n")));
          }
          if (done) break;
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const message = input.value.trim();
        if (!message || send.disabled) return;

        const priorHistory = history.slice(-4);
        addMessage("user", message);
        input.value = "";
        send.disabled = true;
        send.textContent = t("generating");
        const useStreaming = document.querySelector("#streaming").checked;
        const pending = addMessage(
          "assistant",
          useStreaming ? t("waitingStream") : t("waitingFull"),
        );

        try {
          const response = await fetch(useStreaming ? "/chat/stream" : "/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message,
              history: priorHistory,
              max_tokens: Number(document.querySelector("#maxTokens").value),
              temperature: Number(document.querySelector("#temperature").value),
              enable_thinking: document.querySelector("#thinking").checked,
            }),
          });
          if (!response.ok) {
            const body = await response.json();
            throw new Error(JSON.stringify(body.detail ?? body));
          }

          if (useStreaming) {
            pending.remove();
            const bubble = addMessage("assistant", "");
            const text = bubble.querySelector(".bubble");
            let answer = "";
            let finished = null;
            await consumeSSE(response, (eventName, body) => {
              if (eventName === "token") {
                answer += body.text;
                text.textContent = answer;
                chat.scrollTop = chat.scrollHeight;
              } else if (eventName === "done") {
                finished = body;
              } else if (eventName === "error") {
                throw new Error(body.message);
              }
            });
            if (!finished) throw new Error(t("streamClosed"));
            const details = document.createElement("div");
            details.className = "meta";
            details.textContent = t("metaStream", {
              tokens: finished.usage.completion_tokens,
              ttft: finished.ttft_ms,
              latency: finished.latency_ms,
              id: finished.request_id,
            });
            text.append(details);
            history.push({ role: "user", content: message }, { role: "assistant", content: answer });
          } else {
            const body = await response.json();
            pending.remove();
            addMessage(
              "assistant",
              body.answer,
              t("metaFull", {
                tokens: body.usage.completion_tokens,
                latency: body.latency_ms,
                id: body.request_id,
              }),
            );
            history.push({ role: "user", content: message }, { role: "assistant", content: body.answer });
          }
        } catch (error) {
          if (pending.isConnected) pending.remove();
          addMessage("assistant", t("failed", { message: error.message }));
        } finally {
          send.disabled = false;
          send.textContent = t("send");
          input.focus();
        }
      });

      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          form.requestSubmit();
        }
      });

      function clearChat() {
        history = [];
        chat.replaceChildren();
        addMessage("assistant", t("cleared"));
      }

      document.querySelector("#clear").addEventListener("click", clearChat);
      document.querySelector("#newChat").addEventListener("click", clearChat);
      language.addEventListener("change", async () => {
        currentLanguage = language.value;
        applyLanguage();
        await checkHealth();
      });

      const demo = pageParams.get("demo") === "1";
      applyLanguage();
      if (demo) {
        status.textContent = t("online");
        status.classList.add("ok");
        addMessage("user", "What is the best way to serve a 4B model on an 8 GB GPU?");
        addMessage(
          "assistant",
          "Use a 4-bit checkpoint and keep the KV cache bounded. On this machine the INT4-AWQ build is 3.568 GiB, serves 333.90 tok/s at concurrency 4, and leaves room for a 2K context. The gateway adds streaming, admission control, and Prometheus metrics.",
          "128 tokens · TTFT 251.7 ms · total 1.53 s · req-01HX",
        );
      } else {
        addMessage("assistant", t("welcome"));
        checkHealth();
      }
      input.focus();
    </script>
  </body>
</html>
