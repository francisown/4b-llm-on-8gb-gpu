apiVersion: apps/v1
kind: Deployment
metadata:
  name: tls-proxy
  namespace: k8s-tls-demo
  labels:
    app: tls-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tls-proxy
  template:
    metadata:
      labels:
        app: tls-proxy
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        # Makes the emptyDir group-writable for the nginx UID.
        fsGroup: 101
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: https
              scheme: HTTPS
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: https
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tls
              mountPath: /etc/nginx/certs
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: tls-proxy-config
        - name: tls
          secret:
            secretName: gateway-tls
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tls-proxy
  namespace: k8s-tls-demo
  labels:
    app: tls-proxy
spec:
  type: ClusterIP
  selector:
    app: tls-proxy
  ports:
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
