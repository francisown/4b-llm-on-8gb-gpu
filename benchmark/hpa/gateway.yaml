apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-gateway-config
  namespace: hpa-demo
data:
  MODEL_NAME: mock-qwen
  VLLM_BASE_URL: http://mock-vllm:8000
  GATEWAY_MAX_CONCURRENT: "64"
  GATEWAY_MAX_QUEUE: "64"
  GATEWAY_QUEUE_TIMEOUT_SECONDS: "10"
  UPSTREAM_TIMEOUT_SECONDS: "30"
  GATEWAY_VERSION: "0.2.4"
  LOG_LEVEL: INFO
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-gateway
  namespace: hpa-demo
  labels:
    app: inference-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inference-gateway
  template:
    metadata:
      labels:
        app: inference-gateway
    spec:
      containers:
        - name: gateway
          image: ai-inference-gateway:v0.2.4
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: inference-gateway-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: http
              containerPort: 9000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: inference-gateway
  namespace: hpa-demo
spec:
  selector:
    app: inference-gateway
  ports:
    - name: http
      port: 9000
      targetPort: http
