apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-vllm
  namespace: hpa-demo
  labels:
    app: mock-vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-vllm
  template:
    metadata:
      labels:
        app: mock-vllm
    spec:
      containers:
        - name: mock-vllm
          image: python:3.10-slim
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/mock_vllm.py"]
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: script
              mountPath: /app
      volumes:
        - name: script
          configMap:
            name: mock-vllm-script
---
apiVersion: v1
kind: Service
metadata:
  name: mock-vllm
  namespace: hpa-demo
spec:
  selector:
    app: mock-vllm
  ports:
    - name: http
      port: 8000
      targetPort: http
