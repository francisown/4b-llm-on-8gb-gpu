apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inference-gateway
  namespace: ai-inference
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: inference-gateway
  policyTypes:
    - Ingress
  ingress:
    # Prometheus and the load generator live in this namespace. External access
    # is expected through port-forward or an Ingress controller in this namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-inference
      ports:
        - protocol: TCP
          port: 9000
