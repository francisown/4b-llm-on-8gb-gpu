<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>本地 AI 推理实验室</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #090d18;
        --panel: #111827;
        --line: #263248;
        --text: #ecf2ff;
        --muted: #8fa1bd;
        --accent: #6ee7b7;
        --user: #1d4ed8;
        --assistant: #182235;
        font-family: Inter, "Microsoft YaHei", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 15% 0%, #172554 0, transparent 32rem),
          var(--bg);
        color: var(--text);
      }
      main {
        width: min(920px, calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0;
      }
      header, .toolbar, .composer {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      header { justify-content: space-between; margin-bottom: 18px; }
      h1 { margin: 0; font-size: clamp(22px, 4vw, 32px); }
      .subtitle { margin: 5px 0 0; color: var(--muted); font-size: 14px; }
      .status {
        padding: 7px 11px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        font-size: 13px;
      }
      .status.ok { color: var(--accent); border-color: #166534; }
      .chat {
        min-height: 480px;
        max-height: calc(100vh - 310px);
        overflow-y: auto;
        padding: 22px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: color-mix(in srgb, var(--panel) 92%, transparent);
        box-shadow: 0 22px 70px rgb(0 0 0 / 30%);
      }
      .message {
        width: fit-content;
        max-width: 82%;
        margin: 0 0 16px;
        padding: 12px 15px;
        border-radius: 14px;
        line-height: 1.65;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .message.user { margin-left: auto; background: var(--user); }
      .message.assistant { background: var(--assistant); border: 1px solid var(--line); }
      .meta { margin-top: 7px; color: var(--muted); font-size: 12px; }
      .toolbar {
        flex-wrap: wrap;
        margin: 14px 0 10px;
        color: var(--muted);
        font-size: 13px;
      }
      label { display: flex; align-items: center; gap: 6px; }
      input[type="number"] {
        width: 72px;
        padding: 7px;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      button, textarea { font: inherit; }
      button {
        padding: 9px 14px;
        border: 0;
        border-radius: 10px;
        cursor: pointer;
      }
      button:disabled { cursor: wait; opacity: .55; }
      .clear { margin-left: auto; color: var(--muted); background: transparent; border: 1px solid var(--line); }
      .composer { align-items: stretch; }
      textarea {
        flex: 1;
        min-height: 78px;
        resize: vertical;
        padding: 13px;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        outline: none;
      }
      textarea:focus { border-color: #3b82f6; }
      .send { min-width: 92px; color: #04120d; background: var(--accent); font-weight: 700; }
      @media (max-width: 600px) {
        main { width: min(100% - 20px, 920px); padding: 16px 0; }
        .chat { min-height: 58vh; max-height: 58vh; padding: 14px; }
        .message { max-width: 94%; }
        .composer { flex-direction: column; }
        .send { min-height: 44px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>本地 AI 推理实验室</h1>
          <p class="subtitle">浏览器 → FastAPI 网关 → vLLM → RTX 5060</p>
        </div>
        <span id="status" class="status">检查服务中…</span>
      </header>

      <section id="chat" class="chat" aria-live="polite"></section>

      <div class="toolbar">
        <label>输出 token <input id="maxTokens" type="number" min="1" max="2048" value="128" /></label>
        <label>温度 <input id="temperature" type="number" min="0" max="2" step="0.1" value="0.6" /></label>
        <label><input id="thinking" type="checkbox" /> 开启思考</label>
        <label><input id="streaming" type="checkbox" checked /> 流式输出</label>
        <button id="clear" class="clear" type="button">清空对话</button>
      </div>

      <form id="form" class="composer">
        <textarea id="message" placeholder="输入问题；Enter 发送，Shift+Enter 换行" required></textarea>
        <button id="send" class="send" type="submit">发送</button>
      </form>
    </main>

    <script>
      const chat = document.querySelector("#chat");
      const form = document.querySelector("#form");
      const input = document.querySelector("#message");
      const send = document.querySelector("#send");
      const status = document.querySelector("#status");
      let history = [];

      function addMessage(role, content, meta = "") {
        const bubble = document.createElement("article");
        bubble.className = `message ${role}`;
        const text = document.createElement("div");
        text.textContent = content;
        bubble.append(text);
        if (meta) {
          const details = document.createElement("div");
          details.className = "meta";
          details.textContent = meta;
          bubble.append(details);
        }
        chat.append(bubble);
        chat.scrollTop = chat.scrollHeight;
        return bubble;
      }

      async function checkHealth() {
        try {
          const response = await fetch("/health");
          if (!response.ok) throw new Error();
          status.textContent = "模型在线";
          status.classList.add("ok");
        } catch {
          status.textContent = "模型不可用";
          status.classList.remove("ok");
        }
      }

      async function consumeSSE(response, onEvent) {
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        while (true) {
          const { value, done } = await reader.read();
          buffer += decoder.decode(value ?? new Uint8Array(), { stream: !done });
          let boundary;
          while ((boundary = buffer.indexOf("\n\n")) !== -1) {
            const block = buffer.slice(0, boundary);
            buffer = buffer.slice(boundary + 2);
            let eventName = "message";
            const dataLines = [];
            for (const line of block.split("\n")) {
              if (line.startsWith("event:")) eventName = line.slice(6).trim();
              if (line.startsWith("data:")) dataLines.push(line.slice(5).trim());
            }
            if (dataLines.length) {
              onEvent(eventName, JSON.parse(dataLines.join("\n")));
            }
          }
          if (done) break;
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const message = input.value.trim();
        if (!message || send.disabled) return;

        const priorHistory = history.slice(-4);
        addMessage("user", message);
        input.value = "";
        send.disabled = true;
        send.textContent = "生成中…";
        const useStreaming = document.querySelector("#streaming").checked;
        const pending = addMessage(
          "assistant",
          useStreaming ? "正在等待第一个 token…" : "正在等待模型返回完整答案…",
        );

        try {
          const response = await fetch(useStreaming ? "/chat/stream" : "/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message,
              history: priorHistory,
              max_tokens: Number(document.querySelector("#maxTokens").value),
              temperature: Number(document.querySelector("#temperature").value),
              enable_thinking: document.querySelector("#thinking").checked,
            }),
          });
          if (!response.ok) {
            const body = await response.json();
            throw new Error(JSON.stringify(body.detail ?? body));
          }

          if (useStreaming) {
            pending.remove();
            const bubble = addMessage("assistant", "");
            const text = bubble.firstElementChild;
            let answer = "";
            let finished = null;
            await consumeSSE(response, (eventName, body) => {
              if (eventName === "token") {
                answer += body.text;
                text.textContent = answer;
                chat.scrollTop = chat.scrollHeight;
              } else if (eventName === "done") {
                finished = body;
              } else if (eventName === "error") {
                throw new Error(body.message);
              }
            });
            if (!finished) throw new Error("流在完成事件之前断开");
            const details = document.createElement("div");
            details.className = "meta";
            details.textContent = `${finished.usage.completion_tokens} tokens · TTFT ${finished.ttft_ms} ms · 总计 ${finished.latency_ms} ms · ${finished.request_id}`;
            bubble.append(details);
            history.push(
              { role: "user", content: message },
              { role: "assistant", content: answer },
            );
          } else {
            const body = await response.json();
            pending.remove();
            addMessage(
              "assistant",
              body.answer,
              `${body.usage.completion_tokens} tokens · ${body.latency_ms} ms · ${body.request_id}`,
            );
            history.push(
              { role: "user", content: message },
              { role: "assistant", content: body.answer },
            );
          }
        } catch (error) {
          if (pending.isConnected) pending.remove();
          addMessage("assistant", `请求失败：${error.message}`);
        } finally {
          send.disabled = false;
          send.textContent = "发送";
          input.focus();
        }
      });

      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          form.requestSubmit();
        }
      });

      document.querySelector("#clear").addEventListener("click", () => {
        history = [];
        chat.replaceChildren();
        addMessage("assistant", "对话历史已清空。可以开始新的问题。");
      });

      addMessage("assistant", "你好，这是运行在你 RTX 5060 上的本地模型。当前页面保存最近两轮对话历史。");
      checkHealth();
      input.focus();
    </script>
  </body>
</html>
