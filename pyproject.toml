[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm8g"
version = "1.0.0"
description = "Reproducible quantization, evaluation, and serving toolkit for an 8 GB GPU"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
llm8g = "llm8g.cli:main"

[project.optional-dependencies]
serving = ["httpx>=0.28,<0.29"]
web = ["httpx>=0.28,<0.29", "fastapi>=0.136,<0.137", "uvicorn[standard]>=0.52,<0.53", "prometheus-client>=0.26,<0.27", "redis>=5,<6"]
quant = ["vllm==0.29.0", "torch==2.13.0", "transformers==5.14.1", "llmcompressor==0.13.0"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<7", "ruff>=0.6,<1", "mypy>=1.10,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm8g = ["py.typed", "serving/static/*.html"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]

