services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-inference-gateway:v0.2.4
    ports:
      - "9000:9000"
    environment:
      VLLM_BASE_URL: "${VLLM_BASE_URL:-http://host.docker.internal:8000}"
      MODEL_NAME: "${MODEL_NAME:-Qwen3.5-4B-INT4-AWQ-self}"
      UPSTREAM_TIMEOUT_SECONDS: "${UPSTREAM_TIMEOUT_SECONDS:-60}"
      HEALTH_TIMEOUT_SECONDS: "${HEALTH_TIMEOUT_SECONDS:-3}"
      UPSTREAM_CONNECT_RETRIES: "${UPSTREAM_CONNECT_RETRIES:-1}"
      GATEWAY_VERSION: "${GATEWAY_VERSION:-0.2.4}"
      POD_NAME: "${POD_NAME:-local}"
      GATEWAY_API_KEY: "${GATEWAY_API_KEY:-}"
      GATEWAY_API_KEYS: "${GATEWAY_API_KEYS:-}"
      GATEWAY_RATE_LIMIT_PER_MINUTE: "${GATEWAY_RATE_LIMIT_PER_MINUTE:-0}"
      GATEWAY_RATE_LIMIT_MAX_IDENTITIES: "${GATEWAY_RATE_LIMIT_MAX_IDENTITIES:-10000}"
      GATEWAY_MAX_CONCURRENT: "${GATEWAY_MAX_CONCURRENT:-4}"
      GATEWAY_MAX_QUEUE: "${GATEWAY_MAX_QUEUE:-4}"
      GATEWAY_QUEUE_TIMEOUT_SECONDS: "${GATEWAY_QUEUE_TIMEOUT_SECONDS:-10}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
