apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-gateway-config
  namespace: ai-inference
data:
  MODEL_NAME: Qwen3.5-4B-INT4-AWQ-self
  VLLM_BASE_URL: http://host.docker.internal:8000
  GATEWAY_MAX_CONCURRENT: "4"
  GATEWAY_MAX_QUEUE: "4"
  GATEWAY_QUEUE_TIMEOUT_SECONDS: "10"
  UPSTREAM_TIMEOUT_SECONDS: "60"
  LOG_LEVEL: INFO

