apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: k8s-tls-demo

resources:
  - namespace.yaml
  - mock-vllm.yaml
  - gateway.yaml
  - tls-proxy.yaml
  - networkpolicy.yaml

configMapGenerator:
  # Self-contained copies so `kubectl kustomize` works without lifting the
  # kustomize load restrictor.
  - name: mock-vllm-script
    files:
      - mock_vllm.py
  - name: tls-proxy-config
    files:
      - nginx.conf
