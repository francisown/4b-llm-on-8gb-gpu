apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-gateway
  namespace: ai-inference
  labels:
    app.kubernetes.io/name: inference-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: inference-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inference-gateway
    spec:
      containers:
        - name: gateway
          image: ai-inference-gateway:v1
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: inference-gateway-config
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
