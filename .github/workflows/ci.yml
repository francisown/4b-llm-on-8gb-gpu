name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install gateway test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r gateway/requirements-dev.txt pyyaml

      - name: Deterministic repository verification
        run: python scripts/verify_local.py

      # Quality gates. These re-run the gateway suite with coverage on purpose:
      # verify_local.py answers "is the repo internally consistent?" while
      # these answer "did quality regress?".
      - name: Lint (ruff)
        run: python -m ruff check gateway tools tests

      - name: Type check (mypy)
        run: python -m mypy gateway/gateway.py

      - name: Test with coverage floor
        run: |
          python -m pytest -q gateway \
            --cov=gateway --cov-report=term-missing --cov-fail-under=65

      - name: Validate Kubernetes manifests
        run: python scripts/validate_manifests.py

      - name: Validate workflow YAML
        run: python scripts/validate_workflows.py

      - name: Validate documentation links
        run: python scripts/validate_docs.py

      - name: Check generated quantization CSV
        run: python scripts/build_quantization_csv.py --check

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: Render Kustomizations
        run: |
          kubectl kustomize k8s > /tmp/k8s-rendered.yaml
          kubectl kustomize k8s/observability > /tmp/observability-rendered.yaml
          kubectl kustomize k8s/gpu-inference > /tmp/gpu-inference-rendered.yaml
          kubectl kustomize deploy/k8s-overlays/ghcr > /tmp/ghcr-rendered.yaml

      - uses: docker/setup-buildx-action@v3

      - name: Build gateway image
        uses: docker/build-push-action@v6
        with:
          context: gateway
          push: false
          tags: ai-inference-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
